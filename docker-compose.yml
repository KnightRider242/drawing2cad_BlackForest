services:
  api:
    image: python:3.11-slim
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DRAWING2CAD_MCP_DOCKER: "1"
    # Docker MCP worker is separately launched with --network none.
    # The API needs network access only for the local browser/API connection.
    depends_on: []
